# Intégration continue : front, API (sur deux vraies bases PostgreSQL, une par espace),
# parcours dans le navigateur et construction des images.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Même version majeure que le PostgreSQL mutualisé du socle (homelab-platform/database).
  PG_IMAGE: postgres:17-alpine

jobs:
  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck:e2e
      - run: npm test
      - run: npm run build
      - name: Formation exemple valide selon le validateur de référence
        run: npm run valider -- fixtures/formations/togaf10-m1.formation.json

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pl
          POSTGRES_PASSWORD: pl
          POSTGRES_DB: prolearning_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pl" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL_PRODUCTION: postgres://pl:pl@localhost:5432/prolearning_test
      TEST_DATABASE_URL_DEMO: postgres://pl:pl@localhost:5432/prolearning_demo_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Créer la base de l'espace démonstration
        run: psql postgres://pl:pl@localhost:5432/prolearning_test -c 'CREATE DATABASE prolearning_demo_test'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pl
          POSTGRES_PASSWORD: pl
          POSTGRES_DB: prolearning_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pl" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL_PRODUCTION: postgres://pl:pl@localhost:5432/prolearning_e2e
      E2E_DATABASE_URL_DEMO: postgres://pl:pl@localhost:5432/prolearning_demo_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Créer la base de l'espace démonstration
        run: psql postgres://pl:pl@localhost:5432/prolearning_e2e -c 'CREATE DATABASE prolearning_demo_e2e'
      - run: npm ci
      - run: npm ci --prefix server
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          push: false
          load: true
          tags: prolearning-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Le front démarre et répond sur sa sonde
        if: matrix.service == 'web'
        run: |
          docker run -d --name web -p 8080:8080 -e DNS_RESOLVER=127.0.0.11 prolearning-web:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/ | grep -q '<html lang="fr">'
          curl -fsS localhost:8080/une/route/du/front | grep -q '<app-root>'
          docker logs web
      - name: L'API refuse de démarrer sans configuration, avec un message explicite
        if: matrix.service == 'api'
        run: |
          if docker run --rm prolearning-api:ci > out.txt 2>&1; then
            echo "::error::L'API a démarré sans DATABASE_URL_*"; exit 1
          fi
          cat out.txt
          grep -q 'Configuration invalide' out.txt
