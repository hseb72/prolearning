# Front — servi directement par ingress-nginx (TLS cert-manager + WAF), sans passer
# par Kong. Le front relaie lui-même /api vers Kong (cf. docker/nginx.conf.template),
# y compris le retour de connexion Keycloak (/api/auth/callback).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: prolearning
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    # Import des formations : archive de 200 Mo au plus (§ 1 du format).
    nginx.ingress.kubernetes.io/proxy-body-size: '200m'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - prolearning.crealcs.com
      secretName: prolearning-tls
  rules:
    - host: prolearning.crealcs.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
