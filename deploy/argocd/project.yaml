# AppProject Argo CD — périmètre de 3S - Pro Learning.
#
# Un projet par application : la liste des destinations est la barrière qui empêche
# ce déploiement d'écrire ailleurs que dans son namespace. L'hôte d'API vit dans le
# namespace `gateway`, qui appartient au socle : on y demande une entrée
# (homelab-platform) plutôt que d'obtenir le droit d'y écrire.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prolearning
  namespace: argocd
spec:
  description: 3S - Pro Learning — portail de formation (pattern shared de platform-patterns)
  sourceRepos:
    - https://github.com/hseb72/prolearning.git
    - https://github.com/hseb72/prolearning
    # Chart applicatif publié (OCI) par platform-patterns.
    - ghcr.io/hseb72/platform-patterns
  destinations:
    - server: https://kubernetes.default.svc
      namespace: prolearning
  # Seule ressource hors namespace : le Namespace lui-même (CreateNamespace).
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
