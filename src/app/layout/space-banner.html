@if (me(); as me) {
  @if (me.canSwitchSpace) {
    <section
      class="banner"
      [class.demo]="demo()"
      [attr.aria-label]="demo() ? labels.demoBanner : labels.productionBanner"
      [attr.data-space]="me.space"
    >
      <p class="banner-title">
        <strong>{{ demo() ? labels.demoBanner : labels.productionBanner }}</strong>
      </p>

      <div class="banner-actions">
        @if (demo()) {
          <label for="persona">{{ labels.persona }}</label>
          <select id="persona" [disabled]="busy()" (change)="choosePersona($event)">
            @for (persona of personas(); track persona.id) {
              <option [value]="persona.id" [selected]="persona.id === me.actor.id">
                {{ persona.displayName }} — {{ roles[persona.role] }}
              </option>
            } @empty {
              <option [value]="me.actor.id" selected>
                {{ me.actor.displayName }} — {{ roles[me.actor.role] }}
              </option>
            }
          </select>
          <button class="button" type="button" [disabled]="busy()" (click)="toProduction()">
            {{ labels.toProduction }}
          </button>
          <button class="button" type="button" [disabled]="busy()" (click)="reset()">
            {{ labels.reset }}
          </button>
        } @else {
          <button class="button" type="button" [disabled]="busy()" (click)="toDemo()">
            {{ labels.toDemo }}
          </button>
        }
      </div>

      <p class="banner-status" role="status">{{ status() }}</p>
      @if (error(); as error) {
        <p class="banner-error" role="alert">{{ error }}</p>
      }
    </section>
  }
}
